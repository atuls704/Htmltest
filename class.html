<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anadi Shopping Store</title>
    <link rel="stylesheet" href="class.css">
</head>
<body>

    <header class="header">
        <div class="logo">ARZU and RITIk</div>

        <nav class="navbar">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Products</a>
            <a href="#">Contact</a>
        </nav>

        <button class="btn">BUY NOW</button>
    </header>

    <section class="hero">
        <div class="overlay">
            <h1>Arzu and Ritik</h1>
            <h2>Furniture Shopify Theme</h2>

            <p>
                Modern Furniture eCommerce Website with
                beautiful and responsive design.
            </p>

            <button class="demo-btn">VIEW DEMO</button>
        </div>
    </section>

    <section class="shop-section">

        <div class="box">
            <h2>Fashion</h2>
            <img src="box1_image.jpg" alt="Fashion">
            <p>See More</p>
        </div>

        <div class="box">
            <h2>Electronics</h2>
            <img src="box2_image.jpg" alt="Electronics">
            <p>See More</p>
        </div>

        <div class="box">
            <h2>Home Decor</h2>
            <img src="box3_image.jpg" alt="Home Decor">
            <p>See More</p>
        </div>

    </section>

</body>
</html>
